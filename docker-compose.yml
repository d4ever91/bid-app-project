# Local MongoDB for the API.  Start:  npm run db:up   (or: docker compose up -d mongo)
services:
  mongo:
    image: mongo:7.0
    container_name: ordinal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
