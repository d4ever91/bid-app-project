# Optional: MongoDB in Docker.  Start: npm run db:docker   (without Docker, `npm run dev` starts a local MongoDB itself)
services:
  mongo:
    image: mongo:7.0
    container_name: ordinal-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
